
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.116'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    // Core
    implementation files("libs/CustomMachinery-neoforge-1.21.1-0.10.78.jar")
    implementation files("libs/emi-1.1.24+1.21.1+neoforge.jar")

    // GeckoLib
    compileOnly files("libs/geckolib-neoforge-1.21.1-4.9.4.jar")

    // Ars Nouveau
    compileOnly files("libs/ars_nouveau-1.21.1-5.13.5.jar")
    compileOnly files("libs/custom_machinery_ars-1.2.6.jar")
    compileOnly files("libs/nuggets-neoforge-1.21-1.0.7.38.jar")
    compileOnly files("libs/Patchouli-1.21.1-93-NEOFORGE.jar")

    // Mekanism
    compileOnly files("libs/Mekanism-1.21.1-10.7.19.85.jar")
    compileOnly files("libs/CustomMachineryMekanism-1.21.1-1.4.17.jar")

    // Create
    compileOnly files("libs/create-1.21.1-6.0.10.jar")
    compileOnly files("libs/CustomMachineryCreate-1.21.1-1.2.7.jar")
    compileOnly files("libs/flywheel-neoforge-api-1.21.1-1.0.1-11.jar")
    compileOnly files("libs/Registrate-MC1.21-1.3.0+62.jar")

    // PneumaticCraft
    compileOnly files("libs/pneumaticcraft-repressurized-8.2.24-mc1.21.1.jar")
    compileOnly files("libs/CustomMachineryPneumaticCraft-1.21.1-1.0.7.jar")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
